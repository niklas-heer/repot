[package]
name = "repot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Keep every Git repository on a machine organised, current and portable"
license = "MIT"
repository = "https://github.com/niklas-heer/repot"
include = ["/src/**/*.rs", "/tests/*.rs", "/examples/**/*.rs", "/scripts/*", "/assets/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/rust-toolchain.toml", "/mise.toml", "/clippy.toml"]

[dependencies]
clap_complete = { version = "4.6.11", default-features = false }
clap_complete_nushell = { version = "4.6.2", default-features = false }
gix = { version = "0.88.0", default-features = false, features = ["sha1", "sha256"] }
html5gum = { version = "0.8.4", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-normalization", "unicode-casefold", "unicode-segmentation"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "display"] }
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
tempfile = "3.27.0"

[dev-dependencies]
portable-pty = { version = "0.9.0", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3.18", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
unknown_lints = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
