default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--locked", "--all-features", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

[keybindings]
c = "job:clippy"
t = "job:test"
